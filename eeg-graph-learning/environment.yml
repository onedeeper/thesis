name: eeg-graph-learning
channels:
  - defaults
  - conda-forge     # ← include conda-forge
  - pytorch         # ← include PyTorch channel
  - pyg             # ← PyTorch Geometric channel (hosts torch-sparse)
dependencies:
  - python=3.10.13
  - pip=23.3.1
  - setuptools=68.2.2
  - numpy=1.26.3
  - scipy=1.12.0
  - matplotlib=3.8.2
  - pandas=2.2.3
  - pytorch=2.2.1
  - torchvision=0.17.1
  - torchaudio=2.2.1
  - pytorch-sparse=0.6.18
  - jupyter=1.0.0
  - scikit-learn=1.6.1  # Updated from 1.4.0 to latest stable
  - mne=1.9.0  # Updated from 1.6.1 to latest stable
  - pip:
    - torch_geometric==2.6.1
    - tensorboard==2.15.1
    - pytest==7.4.4
    - optuna==3.5.0
    - pyprep==0.4.3
    - openpyxl==3.1.5
    - ruff==0.3.3  # Added for development linting
    - pygeodsy==25.5.5
    - microstructpy==1.5.9
    - geographiclib==2.0
    - haversine==2.9.0
