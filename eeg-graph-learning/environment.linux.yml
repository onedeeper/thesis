# environment.linux.yml  – CUDA‑enabled build for Linux
# This file pulls the official PyTorch CUDA 12.1 build via the
#   "pytorch-cuda" meta‑package.  It in turn installs the correct
#   cudatoolkit and drivers from the nvidia channel, so we don't
#   list "cudatoolkit=" explicitly.

name: eeg-graph-learning-linux
channels:
  - pytorch          # PyTorch & pytorch‑cuda meta‑pkg
  - nvidia           # CUDA runtime libs (pulled transitively)
  - conda-forge
  - defaults
  - pyg

dependencies:
  # ---- language & basics ----
  - python=3.10
  - pip=23.3
  - setuptools=68

  # ---- pip‑only packages ----
  - pip:
      - numpy==1.26
      - scipy==1.12
      - pandas==2.2
      - matplotlib==3.8
      - scikit-learn==1.6
      - torch==2.4.1
      - torchvision
      - torchaudio
      - jupyter==1.0.0
      - mne==1.9.0
      - torch-geometric==2.6.1
      - tensorboard==2.15.1
      - pytest==7.4.4
      - optuna==3.5.0
      - pyprep==0.4.3
      - openpyxl==3.1.5
      - pygeodesy
      - microstructpy==1.5.9
      - geographiclib==2.0
      - haversine==2.9.0
